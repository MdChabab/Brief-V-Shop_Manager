<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
    rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>

  <script src="https://unpkg.com/notifyx@latest/dist/notifyx.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/notifyx@latest/dist/notifyx.min.css" />
  <title>PleaseBuy</title>
</head>

<body style="font-family: &quot;Google Sans&quot;, sans-serif">
  <main class="flex flex-col gap-8 m-8">
    <header class="flex justify-between items-center">
      <h1 class="text-3xl font-bold">PleaseBuy</h1>
      <ion-icon id="openCart" name="cart" class="text-2xl cursor-pointer"></ion-icon>
    </header>

    <div class="flex justify-between">
      <span id="message">Products</span>
      <div class="flex items-center gap-3">
        <ion-icon id="resetFilters" name="refresh" class="text-2xl cursor-pointer hidden"></ion-icon>
        <ion-icon id="openFilters" name="options" class="text-2xl cursor-pointer"></ion-icon>
      </div>
    </div>
    <ul id="productsList" class="grid grid-cols-[repeat(auto-fill,minmax(200px,1fr))] gap-4"></ul>
  </main>

  <dialog id="filterDialog" class="m-auto w-[90%] max-w-md rounded-2xl p-6 shadow-2xl backdrop:bg-black/50">
    <form id="filterForm" class="flex flex-col gap-5">
      <div class="flex justify-between items-center">
        <h2 class="text-xl font-bold">Filter products</h2>
        <ion-icon id="closeDialog" class="text-2xl" name="close"></ion-icon>
      </div>

      <div class="flex flex-col gap-2">
        <label for="searchInput" class="font-medium">Search</label>
        <input type="text" id="searchInput" placeholder="name or description..."
          class="border rounded-xl p-3 outline-none focus:ring-2 focus:ring-blue-400" />
      </div>

      <div class="flex flex-col gap-2">
        <label for="categoryFilter" class="font-medium">Category</label>
        <select id="categoryFilter" class="border rounded-xl p-3 bg-white">
          <option value="">All categories</option>
        </select>
      </div>

      <div class="flex justify-between items-center">
        <label for="stockFilter" class="font-medium">In stock only</label>
        <input type="checkbox" id="stockFilter" class="w-5 h-5" />
      </div>

      <div class="flex flex-col gap-2">
        <label for="maxPrice" class="font-medium">Maximum price (€)</label>
        <input type="number" id="maxPrice" min="0" step="0.01" placeholder="No price limit"
          class="border rounded-xl p-3 outline-none focus:ring-2 focus:ring-blue-400" />
      </div>

      <p id="filterError" class="text-red-500 text-sm hidden">
        Choose at least one filter to apply.
      </p>

      <div class="flex justify-center mt-2 w-[100%]">
        <button type="submit" class="bg-black text-white rounded-xl py-3 w-[100%]">
          Apply filters
        </button>
      </div>
    </form>
  </dialog>

  <dialog id="cartDialog" class="m-auto w-[90%] max-w-md rounded-2xl p-6 shadow-2xl backdrop:bg-black/50">
    <div class="flex justify-between">
      <h2 class="text-xl font-bold">Orders</h2>
      <ion-icon id="closeCart" name="close" class="text-2xl"></ion-icon>
    </div>

    <p id="emptyCartMessage" class="mt-4">No Orders Placed yet.</p>

    <ul id="ordersList"></ul>

    <div class="flex flex-col gap-2 mt-4">
      <p>Items: <span id="cartCount">0</span></p>
      <p>Total: €<span id="cartTotal">0.00</span></p>
    </div>

    <div class="flex justify-center w-[100%] gap-2 mt-4">
      <button id="checkout" type="button" class="bg-black text-white rounded-xl py-3 w-[100%] cursor-pointer">
        Checkout
      </button>
      <button id="emptyCart" type="button"
        class="bg-white hover:bg-red-700 hover:text-white border rounded-xl py-3 w-[100%] cursor-pointer">
        Empty Cart
      </button>
    </div>
  </dialog>

  <dialog id="customerDialog" class="m-auto w-[90%] max-w-md rounded-2xl p-6 shadow-2xl backdrop:bg-black/50">
    <form id="customerForm" class="flex flex-col gap-4">
      <div class="flex justify-between items-center">
        <h2 class="text-xl font-bold">Customer Information</h2>
        <button type="button" id="closeCustomer" class="text-2xl">
          &times;
        </button>
      </div>

      <div class="flex flex-col gap-1">
        <label for="customerName">Full name *</label>
        <input type="text" id="customerName" name="name" required class="border rounded-xl p-3" />
      </div>

      <div class="flex flex-col gap-1">
        <label for="customerEmail">Email *</label>
        <input type="email" id="customerEmail" name="email" required class="border rounded-xl p-3" />
      </div>

      <div class="flex flex-col gap-1">
        <label for="customerAddress">Address *</label>
        <input type="text" id="customerAddress" name="address" required class="border rounded-xl p-3" />
      </div>

      <div class="flex flex-col gap-1">
        <label for="customerCity">City *</label>
        <input type="text" id="customerCity" name="city" required class="border rounded-xl p-3" />
      </div>

      <div class="flex flex-col gap-1">
        <label for="customerTelephone">Telephone</label>
        <input type="tel" id="customerTelephone" name="telephone" class="border rounded-xl p-3" />
      </div>

      <div class="flex flex-col gap-1">
        <label for="customerPostalCode">Postal code</label>
        <input type="text" id="customerPostalCode" name="postalCode" class="border rounded-xl p-3" />
      </div>

      <div class="flex flex-col gap-1">
        <label for="customerNote">Note</label>
        <textarea id="customerNote" name="note" class="border rounded-xl p-3"></textarea>
      </div>

      <button type="submit" id="submitOrder" class="bg-black text-white rounded-xl py-3">
        Place order
      </button>
    </form>
  </dialog>

  <script src="./js/app.js"></script>
</body>

</html>
